name:  laravel-postcode-nl

services:

  composer:
    image: composer:2
    volumes:
      - .:/var/www
    working_dir: /var/www

  php-8.2:
    image: php:8.2-cli-alpine
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: vendor/bin/phpunit

  php-8.3:
    image: php:8.3-cli-alpine
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: vendor/bin/phpunit

  php-8.4:
    image: php:8.4-cli-alpine
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: vendor/bin/phpunit
